{% extends 'base.html' %}
{% block content %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto mb-3">
        <h2>Report Review</h2>
        <hr />
        <form method="POST">
          {% csrf_token %}
          <p>
            <label for="report">Reason for Report:</label>
            <textarea name="report" required class="form-control" id="report"></textarea>
          </p>
          <div class="text-start">
            <button type="submit" class="btn btn-danger">Report</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
